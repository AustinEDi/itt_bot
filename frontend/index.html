<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>ITT US30 Bot · Trading Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body {
      background: radial-gradient(circle at 20% 20%, #1e293b, #0f172a);
      font-family: 'Inter', system-ui, sans-serif;
    }
    .glass {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 1.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .stat-bg {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 1.2rem;
      padding: 1rem;
      text-align: center;
    }
    .btn-start {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      transition: all 0.2s;
    }
    .btn-start:active { transform: scale(0.96); }
    .btn-stop {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      transition: all 0.2s;
    }
    .btn-stop:active { transform: scale(0.96); }
    .pulse-dot { animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.7); }
      70% { box-shadow: 0 0 0 14px rgba(74,222,128,0); }
      100% { box-shadow: 0 0 0 0 rgba(74,222,128,0); }
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-lg space-y-6">

    <!-- Header -->
    <div class="glass p-6 text-center space-y-2">
      <div class="flex justify-center items-center gap-3">
        <i class="fa-solid fa-chart-line text-emerald-400 text-3xl"></i>
        <h1 class="text-3xl font-black text-white">ITT US30</h1>
      </div>
      <p class="text-slate-400 text-xs uppercase tracking-widest">Institutional Transaction Theory</p>
    </div>

    <!-- Stats Row -->
    <div class="grid grid-cols-2 gap-3">
      <div class="stat-bg">
        <p class="text-slate-500 text-xs uppercase">Status</p>
        <div class="flex items-center justify-center gap-2 mt-1">
          <span id="botStatusDot" class="w-3 h-3 rounded-full bg-slate-500"></span>
          <span id="botStatusText" class="text-lg font-bold text-slate-300">--</span>
        </div>
      </div>
      <div class="stat-bg">
        <p class="text-slate-500 text-xs uppercase">Balance</p>
        <p id="balanceDisplay" class="text-xl font-black text-white">--</p>
      </div>
      <div class="stat-bg">
        <p class="text-slate-500 text-xs uppercase">Floating P&L</p>
        <p id="floatingPlDisplay" class="text-xl font-black">--</p>
      </div>
      <div class="stat-bg">
        <p class="text-slate-500 text-xs uppercase">Win Rate</p>
        <p id="winRateDisplay" class="text-xl font-black text-white">--</p>
      </div>
    </div>

    <!-- Equity Curve -->
    <div class="glass p-4">
      <h3 class="text-slate-400 text-sm uppercase tracking-wide mb-2">Equity Curve</h3>
      <div class="relative" style="height: 200px;">
        <canvas id="equityChart"></canvas>
      </div>
    </div>

    <!-- Controls -->
    <div class="flex gap-4">
      <button onclick="startBot()" class="btn-start flex-1 py-3 rounded-2xl text-black font-bold text-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-play"></i> Start
      </button>
      <button onclick="stopBot()" class="btn-stop flex-1 py-3 rounded-2xl text-white font-bold text-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-stop"></i> Stop
      </button>
    </div>

    <!-- Live Activity Log -->
    <div class="glass p-4">
      <h3 class="text-slate-400 text-sm uppercase tracking-wide mb-2 flex items-center gap-2">
        <span id="logActivityDot" class="w-2 h-2 rounded-full bg-gray-500"></span>
        Live Activity
      </h3>
      <div id="logContainer" class="bg-gray-950 rounded-xl p-3 h-40 overflow-y-auto font-mono text-xs text-green-300 leading-relaxed">
        <div class="text-slate-600">Waiting for bot to start...</div>
      </div>
    </div>

    <!-- Trade History -->
    <div class="glass p-4">
      <h3 class="text-slate-400 text-sm uppercase tracking-wide mb-3">Trade History</h3>
      <div class="overflow-x-auto max-h-48 overflow-y-auto">
        <table class="w-full text-xs">
          <thead class="text-slate-500 border-b border-slate-700">
            <tr><th>Time</th><th>Dir</th><th>Entry</th><th>Exit</th><th>Result</th><th>P&L</th></tr>
          </thead>
          <tbody id="tradeTableBody">
            <tr><td colspan="6" class="text-slate-600 text-center py-4">No trades yet</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div class="text-center text-xs text-slate-600 pb-4">
      <span id="symbolFooter" class="font-mono">US30m</span> · AI filter ≥ 65% · NY AM session
    </div>
  </div>

  <script>
    // Chart
    const ctx = document.getElementById('equityChart').getContext('2d');
    const equityChart = new Chart(ctx, {
      type: 'line',
      data: { labels: [], datasets: [{ label: 'Equity', data: [], borderColor: '#22c55e', backgroundColor: 'rgba(34,197,94,0.1)', borderWidth: 2, pointRadius: 0, tension: 0.2, fill: true }] },
      options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: 'rgba(255,255,255,0.05)' } } } }
    });

    function updateEquityChart(data) {
      equityChart.data.labels = data.map(d => new Date(d.time * 1000).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }));
      equityChart.data.datasets[0].data = data.map(d => d.balance);
      equityChart.update();
    }

    // Data fetching
    async function updateStatus() {
      try {
        const [statusRes, equityRes, historyRes] = await Promise.all([
          fetch('/api/status'), fetch('/api/equity'), fetch('/api/history')
        ]);
        const status = await statusRes.json();
        const equity = await equityRes.json();
        const trades = await historyRes.json();

        document.getElementById('botStatusDot').className = status.bot_running ? 'w-3 h-3 rounded-full bg-emerald-500 pulse-dot' : 'w-3 h-3 rounded-full bg-red-500';
        document.getElementById('botStatusText').textContent = status.bot_running ? 'Running' : 'Stopped';
        document.getElementById('botStatusText').className = status.bot_running ? 'text-lg font-bold text-emerald-400' : 'text-lg font-bold text-red-400';

        document.getElementById('balanceDisplay').textContent = status.account_balance ? '$' + Number(status.account_balance).toFixed(2) : '--';

        const floatEl = document.getElementById('floatingPlDisplay');
        if (equity.length > 0) {
          const profit = equity[equity.length-1].profit || 0;
          floatEl.textContent = (profit >= 0 ? '+' : '') + '$' + profit.toFixed(2);
          floatEl.className = 'text-xl font-black ' + (profit >= 0 ? 'text-green-400' : 'text-red-400');
        } else {
          floatEl.textContent = '--';
          floatEl.className = 'text-xl font-black text-slate-400';
        }

        const winEl = document.getElementById('winRateDisplay');
        if (trades.length > 0) {
          const wins = trades.filter(t => t.result === 'win').length;
          winEl.textContent = ((wins / trades.length) * 100).toFixed(0) + '%';
        } else {
          winEl.textContent = '--';
        }

        updateEquityChart(equity);

        const tbody = document.getElementById('tradeTableBody');
        if (trades.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-slate-600 text-center py-4">No trades yet</td></tr>';
        } else {
          tbody.innerHTML = trades.slice(0, 10).map(t => `
            <tr class="border-b border-slate-800">
              <td>${new Date(t.timestamp).toLocaleTimeString('en-US', {hour:'2-digit', minute:'2-digit'})}</td>
              <td class="${t.direction === 'buy' ? 'text-green-400' : 'text-red-400'} font-bold">${t.direction?.toUpperCase()}</td>
              <td>${t.entry}</td>
              <td>${t.exit || '--'}</td>
              <td class="${t.result === 'win' ? 'text-green-400' : t.result === 'loss' ? 'text-red-400' : 'text-slate-400'}">${t.result}</td>
              <td class="${t.profit > 0 ? 'text-green-400' : t.profit < 0 ? 'text-red-400' : 'text-slate-400'}">${t.profit ? (t.profit > 0 ? '+' : '') + t.profit.toFixed(2) : '--'}</td>
            </tr>
          `).join('');
        }

        document.getElementById('symbolFooter').textContent = status.symbol || 'US30m';
      } catch(e) { console.error(e); }
    }

    // Live log updater
    async function updateLog() {
      try {
        const res = await fetch('/api/log');
        const logs = await res.json();
        const container = document.getElementById('logContainer');
        if (logs.length === 0) {
          container.innerHTML = '<div class="text-slate-600">Waiting for bot to start...</div>';
        } else {
          container.innerHTML = logs.map(msg => `<div>${msg}</div>`).join('');
          container.scrollTop = container.scrollHeight;
        }
        const dot = document.getElementById('logActivityDot');
        dot.className = 'w-2 h-2 rounded-full ' + (document.getElementById('botStatusText').textContent === 'Running' ? 'bg-green-500 pulse-dot' : 'bg-gray-500');
      } catch(e) {}
    }

    async function startBot() {
      const btn = event.target;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Connecting...';
      const res = await fetch('/api/start', { method: 'POST' });
      const data = await res.json();
      if (data.error) alert('Error: ' + data.error);
      btn.innerHTML = '<i class="fa-solid fa-play"></i> Start';
      btn.disabled = false;
      updateStatus();
    }

    function stopBot() {
      fetch('/api/stop', { method: 'POST' });
    }

    setInterval(updateStatus, 5000);
    setInterval(updateLog, 2000);
    updateStatus();
    updateLog();
  </script>
</body>
</html>
